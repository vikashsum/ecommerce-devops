name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

# Permissions required by GitHub Actions.
# id-token: write allows GitHub Actions to request
# an OIDC token for AWS authentication.
permissions:
  contents: read
  id-token: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: backend
        run: |
          python -m pytest -v

  # --------------------------------------------------
  # Build and push Docker image to Amazon ECR
  #
  # This job runs ONLY when code is pushed directly
  # to the develop branch.
  # --------------------------------------------------
  docker-build-push:
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # GitHub OIDC -> AWS STS -> IAM Role
      # No long-lived AWS access keys are stored in GitHub.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::303164492950:role/ecommerce-devops-github-actions
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/ecommerce-devops-backend:${{ github.sha }} \
            ./backend

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/ecommerce-devops-backend:${{ github.sha }}